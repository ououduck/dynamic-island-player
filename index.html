<!DOCTYPE html>
<!-- 
  灵动岛音乐播放器示例页面
  功能：展示 DynamicIslandPlayer 的挂载与播放列表加载方式
  依赖：dynamic-island-player.css, dynamic-island-player.js
-->
<html lang="zh-CN">
<head>
  <!-- 移动端优化设置 -->
  <meta charset="UTF-8">
  <title>灵动岛播放器 · Dynamic Island Player</title>
 
<!--将下面这段代码加入head标签内-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="纯 HTML/CSS/JS 编写的灵动岛风格音乐播放器，零依赖，可直接嵌入任意网页。">
  <!-- 引入播放器样式文件 -->
  <link rel="stylesheet" href="./D-music/dynamic-island-player.css">
<!--将上面这段代码加入head标签内-->

  <!-- ↓↓↓ 仅用于示例页面的氛围背景，接入你自己的项目时可以直接删掉 ↓↓↓ -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      color: #f5f5f7;
      background:
        radial-gradient(120% 90% at 50% -10%, #1c2a3a 0%, transparent 55%),
        radial-gradient(90% 70% at 15% 100%, #241a33 0%, transparent 60%),
        #05060a;
      overflow-x: hidden;
    }

    .demo-hint {
      position: fixed;
      left: 50%;
      bottom: max(8vh, calc(env(safe-area-inset-bottom) + 28px));
      transform: translateX(-50%);
      max-width: 560px;
      padding: 0 24px;
      text-align: center;
      transition: opacity .6s ease;
    }

    .demo-hint h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .demo-hint p {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(245, 245, 247, 0.55);
    }

    .demo-hint kbd {
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      font-family: inherit;
      font-size: 12px;
    }

    /* 灵动岛浮在顶部时，标题向下避让 */
    body:has(.dynamic-island-player:not(.collapsed)) .demo-hint {
      opacity: 0.35;
    }
  </style>
  <!-- ↑↑↑ 示例装饰结束 ↑↑↑ -->

</head>
<body>
 
 <!-- ↓↓↓ 仅示例文案，可删除 ↓↓↓ -->
  <main class="demo-hint">
    <h1>Dynamic Island Player</h1>
    <p>点击顶部灵动岛展开，点击岛外区域收回。</p>
    <p>进度条支持点击与拖动，播放时右上角的声波会随节奏律动。</p>
  </main>
 <!-- ↑↑↑ 示例文案结束 ↑↑↑ -->
 
 <!--将下面这段代码加入body标签内-->
 
  <!-- 引入播放器核心脚本 -->
  <script src="./D-music/dynamic-island-player.js"></script>
  <script>
    // 初始化播放器实例
    const player = new DynamicIslandPlayer();
    // 加载播放列表
    // 加载播放列表数据
    player.loadPlaylist('./playlistData.json');
    // 自定义下一首功能
    // 自定义下一首按钮点击事件
    player.onNext = () => {
      console.log('下一首');
    }
  </script>

<!--将上面这段代码加入body标签内-->

</body>
</html>
